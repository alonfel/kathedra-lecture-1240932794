ortrait=0" title="צרפת – המנון לאהבה - יואל אתרוג" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="caption-overlay" dir="rtl" aria-hidden="true"></div></div></main><dialog id="welcome" aria-labelledby="welcome-title"><h2 id="welcome-title">תודה שהצטרפתם להרצאה ״צרפת – המנון לאהבה - יואל אתרוג״!</h2><p>אנחנו שמחים להציע לכם שירות חדש המאפשר לצפות בהקלטת ההרצאה עם כתוביות בעברית או בלעדיהן, לפי בחירתכם.</p><p>מאחלים לכם צפייה מהנה ומעשירה!</p><form method="dialog"><button type="submit" autofocus>המשך לצפייה</button></form></dialog><script>document.getElementById('welcome').showModal();</script><script src="https://player.vimeo.com/api/player.js"></script><script>(() => {
  const $ = id => document.getElementById(id);
  const play = $('play-toggle'), seek = $('seek'), volume = $('volume');
  const captions = $('captions-toggle'), status = $('captions-status');
  const full = $('fullscreen'), overlay = $('caption-overlay');
  const smaller = $('caption-smaller'), larger = $('caption-larger');
  let captionScale = 1;
  const updateSize = () => {
    overlay.style.fontSize = `clamp(${Math.round(18 * captionScale)}px, ${2.3 * captionScale}vw, ${Math.round(32 * captionScale)}px)`;
    smaller.disabled = !trackOn || captionScale <= 0.7;
    larger.disabled = !trackOn || captionScale >= 1.6;
  };
  smaller.addEventListener('click', () => { captionScale = Math.max(0.7, Math.round((captionScale - 0.15) * 100) / 100); updateSize(); });
  larger.addEventListener('click', () => { captionScale = Math.min(1.6, Math.round((captionScale + 0.15) * 100) / 100); updateSize(); });
  play.disabled = volume.disabled = full.disabled = true;
  if (!window.Vimeo?.Player) {
    status.textContent = 'לא ניתן לטעון את הנגן. יש לבדוק את החיבור לאינטרנט.';
    return;
  }
  const player = new Vimeo.Player($('lecture-player'));
  let duration = 0, paused = true, trackOn = true, dragging = false;
  const format = seconds => {
    const n = Math.max(0, Math.floor(seconds || 0));
    const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s = n % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
  };
  const setPlay = isPaused => {
    paused = isPaused;
    play.textContent = paused ? '▶' : '❚❚';
    play.setAttribute('aria-label', paused ? 'ניגון' : 'השהיה');
  };
  const setCaptions = on => {
    trackOn = on;
    captions.setAttribute('aria-pressed', String(on));
    captions.textContent = on ? 'הסתרת כתוביות' : 'הצגת כתוביות';
    if (!on) overlay.replaceChildren();
    updateSize();
  };
  const report = () => { status.textContent = 'הפעולה לא הצליחה. נסו שוב.'; };
  player.on('play', () => setPlay(false));
  player.on('pause', () => setPlay(true));
  player.on('ended', () => setPlay(true));
  player.on('timeupdate', data => {
    duration = data.duration || duration;
    $('elapsed').textContent = format(data.seconds);
    $('duration').textContent = format(duration);
    if (!dragging && duration) seek.value = Math.round(data.seconds / duration * 1000);
    seek.setAttribute('aria-valuetext', `${format(data.seconds)} מתוך ${format(duration)}`);
  });
  player.on('texttrackchange', track => setCaptions(!!track.language));
  player.on('cuechange', data => {
    if (!trackOn) return;
    const lines = (data.cues || []).map(cue => {
      const doc = new DOMParser().parseFromString(cue.html || cue.text || '', 'text/html');
      doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
      return doc.body.textContent;
    }).filter(Boolean);
    overlay.replaceChildren();
    if (lines.length) { const span = document.createElement('span'); span.textContent = lines.join('\n'); overlay.append(span); }
  });
  player.on('error', () => { status.textContent = 'לא ניתן לטעון או לנגן את הסרטון. ייתכן שהטמעה מקומית חסומה ב־Vimeo.'; });
  const timer = setTimeout(() => { status.textContent = 'הנגן עדיין לא נטען. ייתכן שהטמעה מקומית חסומה ב־Vimeo.'; }, 15000);
  player.ready().then(async () => {
    clearTimeout(timer);
    status.textContent = '';
    play.disabled = false;
    full.disabled = !document.fullscreenEnabled;
    try {
      duration = await player.getDuration();
      $('duration').textContent = format(duration);
      seek.disabled = !duration;
    } catch (_) { report(); }
    try { volume.value = await player.getVolume(); volume.disabled = false; } catch (_) {}
    try {
      const tracks = await player.getTextTracks();
      const hebrew = tracks.find(t => t.language === 'he');
      captions.disabled = !hebrew;
      if (hebrew) {
        await player.enableTextTrack('he', hebrew.kind, false);
        setCaptions(true);
      } else {
        setCaptions(false);
      }
    } catch (_) { captions.disabled = true; status.textContent = 'לא ניתן להפעיל את הכתוביות.'; }
  }).catch(() => { clearTimeout(timer); status.textContent = 'לא ניתן לטעון את הסרטון. ייתכן שהטמעה מקומית חסומה ב־Vimeo.'; });
  play.addEventListener('click', async () => {
    try { status.textContent = ''; if (paused) await player.play(); else await player.pause(); } catch (_) { report(); }
  });
  seek.addEventListener('input', () => { dragging = true; $('elapsed').textContent = format(duration * Number(seek.value) / 1000); });
  seek.addEventListener('change', async () => {
    try { await player.setCurrentTime(duration * Number(seek.value) / 1000); } catch (_) { report(); }
    finally { dragging = false; }
  });
  volume.addEventListener('input', () => { player.setVolume(Number(volume.value)).catch(report); });
  captions.addEventListener('click', async () => {
    captions.disabled = true;
    const target = !trackOn;
    try {
      if (target) await player.enableTextTrack('he', undefined, false);
      else await player.disableTextTrack();
      setCaptions(target);
      status.textContent = '';
    } catch (_) { report(); }
    finally { captions.disabled = false; }
  });
  full.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.querySelector('main').requestFullscreen();
    } catch (_) { report(); }
  });
  const main = document.querySelector('main');
  const controls = document.querySelector('.custom-controls');
  let hideTimer;
  const scheduleHide = () => {
    clearTimeout(hideTimer);
    if (document.fullscreenElement !== main) return;
    main.classList.remove('controls-hidden');
    hideTimer = setTimeout(() => {
      if (!controls.matches(':hover') && !controls.querySelector(':focus-visible')) {
        main.classList.add('controls-hidden');
      }
    }, 2500);
  };
  ['mousemove', 'pointermove', 'touchstart', 'keydown'].forEach(event => main.addEventListener(event, scheduleHide, { passive: true }));
  document.querySelector('.fullscreen-surface').addEventListener('click', () => { play.click(); });
  controls.addEventListener('mouseleave', scheduleHide);
  controls.addEventListener('focusout', scheduleHide);
  document.addEventListener('fullscreenchange', () => {
    full.textContent = document.fullscreenElement === main ? 'יציאה ממסך מלא' : 'מסך מלא';
    clearTimeout(hideTimer);
    main.classList.remove('controls-hidden');
    if (document.fullscreenElement === main) scheduleHide();
  });
})();
</script></body></html>
